<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 730" width="1320" height="730" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filters -->
    <filter id="shadow" x="-5%" y="-5%" width="112%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <filter id="shadow-sm" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <g transform="translate(660, 44)">
    <text text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a" letter-spacing="-0.5">
      Adaptive Agentic RAG <tspan fill="#64748b" font-weight="400">—</tspan> Multi-Tier Hybrid Retrieval &amp; Cognitive Context Engine
    </text>
  </g>

  <!-- ==================== TOP SECTION: Observability & Telemetry ==================== -->
  <g transform="translate(485, 75)">
    <!-- Container -->
    <rect x="0" y="0" width="470" height="122" rx="16" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.8" stroke-dasharray="6,6" opacity="0.95"/>
    <text x="235" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="#7E22CE" letter-spacing="0.2">
      Async Tracing &amp; Telemetry Pipeline (OpenTelemetry + Phoenix Daemon)
    </text>

    <!-- Sub-box 1: Trace Manager -->
    <g transform="translate(18, 38)" filter="url(#shadow-sm)">
      <rect x="0" y="0" width="200" height="68" rx="12" fill="#F3E8FF" stroke="#A855F7" stroke-width="1.4"/>
      <text x="100" y="27" text-anchor="middle" font-size="12" font-weight="700" fill="#581C87">Trace &amp; Metric Extraction</text>
      <text x="100" y="44" text-anchor="middle" font-size="10.5" font-weight="500" fill="#7E22CE">(OTLP Spans, Latency &amp; Tokens)</text>
      <text x="100" y="58" text-anchor="middle" font-size="9" fill="#9333EA">Phoenix gRPC / HTTP :6006</text>
    </g>

    <!-- Bidirectional Arrows between Trace and Redaction -->
    <path d="M 224 64 L 246 64" fill="none" stroke="#A855F7" stroke-width="1.6" marker-end="url(#arrow-purple)"/>
    <path d="M 246 78 L 224 78" fill="none" stroke="#A855F7" stroke-width="1.6" marker-end="url(#arrow-purple)"/>

    <!-- Sub-box 2: Privacy Redactor -->
    <g transform="translate(252, 38)" filter="url(#shadow-sm)">
      <rect x="0" y="0" width="200" height="68" rx="12" fill="#F3E8FF" stroke="#A855F7" stroke-width="1.4"/>
      <text x="100" y="27" text-anchor="middle" font-size="12" font-weight="700" fill="#581C87">Automated Redaction</text>
      <text x="100" y="44" text-anchor="middle" font-size="10.5" font-weight="500" fill="#7E22CE">(Prompts, Docs &amp; PII Scrubbing)</text>
      <text x="100" y="58" text-anchor="middle" font-size="9" fill="#9333EA">Zero-Leakage Telemetry Filter</text>
    </g>
  </g>

  <!-- ==================== LEFT: Agent Action / Query ==================== -->
  <g transform="translate(28, 355)" filter="url(#shadow)">
    <rect x="0" y="0" width="175" height="100" rx="22" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="87" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">Agent Action / Query</text>
    <text x="87" y="53" text-anchor="middle" font-size="11" font-weight="500" fill="#2563EB">(Context + Timestamp [t_now])</text>
    <text x="87" y="72" text-anchor="middle" font-size="10.5" fill="#3B82F6">Tenant ID &amp; ACL Scope</text>
    <text x="87" y="87" text-anchor="middle" font-size="9.5" fill="#60A5FA" font-style="italic">REST / Upload / Web UI</text>
  </g>

  <!-- Arrow: Input -> Router -->
  <path d="M 203 405 L 238 405" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>

  <!-- ==================== ROUTER: Adaptive Cognitive Router ==================== -->
  <g transform="translate(244, 332)" filter="url(#shadow)">
    <rect x="0" y="0" width="202" height="148" rx="16" fill="#FEFCE8" stroke="#EAB308" stroke-width="2"/>
    <text x="101" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#854D0E">Adaptive Memory Router</text>
    <text x="101" y="50" text-anchor="middle" font-size="10.5" font-family="monospace" font-weight="600" fill="#A16207">{intent, entity, temporal_scope}</text>
    <text x="101" y="73" text-anchor="middle" font-size="11.5" font-weight="600" fill="#854D0E">Route / Dynamic Context</text>
    <text x="101" y="91" text-anchor="middle" font-size="11.5" font-weight="600" fill="#854D0E">Governor &amp; Escalator</text>
    <rect x="18" y="106" width="166" height="26" rx="8" fill="#FEF08A" stroke="#CA8A04" stroke-width="1"/>
    <text x="101" y="123" text-anchor="middle" font-size="10" font-weight="600" fill="#713F12">Direct / Hybrid / Deep Escalation</text>
  </g>

  <!-- ==================== CENTER: 4-Tier Hybrid Memory Stores ==================== -->
  <g transform="translate(485, 226)">
    <!-- Container -->
    <rect x="0" y="0" width="276" height="466" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.8" stroke-dasharray="6,6"/>
    <text x="138" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#475569" letter-spacing="0.3">
      4-Tier Hybrid Memory Stores
    </text>

    <!-- Tier 1: Working Memory & Semantic Cache -->
    <g transform="translate(18, 42)" filter="url(#shadow-sm)">
      <rect x="0" y="0" width="240" height="86" rx="12" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.6"/>
      <text x="120" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#14532D">Tier 1: Redis Semantic Cache</text>
      <text x="120" y="42" text-anchor="middle" font-size="10.5" font-weight="600" fill="#15803D">(RediSearch Vector Index + Cosine)</text>
      <text x="120" y="58" text-anchor="middle" font-size="9.5" fill="#166534">Working Context &amp; Instant Sub-50ms Hit</text>
      <text x="120" y="73" text-anchor="middle" font-size="9" fill="#15803D" font-weight="500">[tenant_id, similarity_thresh, TTL]</text>
    </g>

    <!-- Tier 2: Episodic BM25 Store -->
    <g transform="translate(18, 146)" filter="url(#shadow-sm)">
      <rect x="0" y="0" width="240" height="86" rx="12" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.6"/>
      <text x="120" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#14532D">Tier 2: BM25 Keyword Stage</text>
      <text x="120" y="42" text-anchor="middle" font-size="10.5" font-weight="600" fill="#15803D">(Rank-BM25 Sparse Lexical Engine)</text>
      <text x="120" y="58" text-anchor="middle" font-size="9.5" fill="#166534">Exact Terms, Acronyms &amp; Identifiers</text>
      <text x="120" y="73" text-anchor="middle" font-size="9" fill="#15803D" font-weight="500">[dynamic_invalidation_on_ingest]</text>
    </g>

    <!-- Tier 3: Dense Vector Stage -->
    <g transform="translate(18, 250)" filter="url(#shadow-sm)">
      <rect x="0" y="0" width="240" height="86" rx="12" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.6"/>
      <text x="120" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#14532D">Tier 3: Dense Vector Store</text>
      <text x="120" y="42" text-anchor="middle" font-size="10.5" font-weight="600" fill="#15803D">(NeonDB / PostgreSQL + pgvector)</text>
      <text x="120" y="58" text-anchor="middle" font-size="9.5" fill="#166534">HNSW / Cosine Asymmetric Embeddings</text>
      <text x="120" y="73" text-anchor="middle" font-size="9" fill="#15803D" font-weight="500">[NVIDIA Nemotron / OpenAI 3-Small]</text>
    </g>

    <!-- Tier 4: Document Repository -->
    <g transform="translate(18, 354)" filter="url(#shadow-sm)">
      <rect x="0" y="0" width="240" height="86" rx="12" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.6"/>
      <text x="120" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#14532D">Tier 4: Relational Knowledge Store</text>
      <text x="120" y="42" text-anchor="middle" font-size="10.5" font-weight="600" fill="#15803D">(PostgreSQL Chunk &amp; Version Store)</text>
      <text x="120" y="58" text-anchor="middle" font-size="9.5" fill="#166534">Multi-Tenant Metadata &amp; Document ACLs</text>
      <text x="120" y="73" text-anchor="middle" font-size="9" fill="#15803D" font-weight="500">[valid_from, valid_to, sha256_hash]</text>
    </g>
  </g>

  <!-- ==================== ROUTER -> 4 TIERS CONNECTORS ==================== -->
  <!-- Router to Tier 1 -->
  <path d="M 446 372 C 472 372, 477 311, 497 311" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <rect x="439" y="327" width="62" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="470" y="339" text-anchor="middle" font-size="9" font-family="monospace" fill="#475569">hot_read</text>

  <!-- Router to Tier 2 -->
  <path d="M 446 395 C 472 395, 477 415, 497 415" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <rect x="439" y="398" width="62" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="470" y="410" text-anchor="middle" font-size="9" font-family="monospace" fill="#475569">bm25_log</text>

  <!-- Router to Tier 3 -->
  <path d="M 446 418 C 472 418, 477 519, 497 519" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <rect x="424" y="468" width="76" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="462" y="480" text-anchor="middle" font-size="9" font-family="monospace" fill="#475569">semantic_match</text>

  <!-- Router to Tier 4 -->
  <path d="M 446 441 C 472 441, 477 623, 497 623" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <rect x="427" y="546" width="74" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="464" y="558" text-anchor="middle" font-size="9" font-family="monospace" fill="#475569">doc_traverse</text>

  <!-- ==================== RIGHT-MIDDLE: Reciprocal Rank Fusion & Guardrails ==================== -->
  <g transform="translate(830, 332)" filter="url(#shadow)">
    <rect x="0" y="0" width="206" height="152" rx="16" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
    <text x="103" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">Reciprocal Rank</text>
    <text x="103" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">Fusion &amp; Guardrails</text>
    <text x="103" y="68" text-anchor="middle" font-size="10.5" font-weight="600" fill="#B91C1C">(RRF k=60 + Cross-Encoder)</text>
    <rect x="14" y="80" width="178" height="32" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
    <text x="103" y="95" text-anchor="middle" font-size="10" font-weight="700" fill="#7F1D1D">NVIDIA NIM Reranker</text>
    <text x="103" y="106" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#991B1B">llama-nemotron-rerank-vl-1b</text>
    <text x="103" y="128" text-anchor="middle" font-size="10" font-weight="500" fill="#B91C1C">Temporal Validity Filter</text>
    <text x="103" y="142" text-anchor="middle" font-size="10" font-weight="500" fill="#B91C1C">+ Token Budgeter</text>
  </g>

  <!-- ==================== TIERS -> FUSION CONNECTORS ==================== -->
  <!-- Tier 1 to Fusion (on cache miss) -->
  <path d="M 743 311 C 780 311, 788 372, 824 372" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <!-- Tier 2 to Fusion -->
  <path d="M 743 415 L 824 408" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <!-- Tier 3 to Fusion -->
  <path d="M 743 519 C 780 519, 788 440, 824 440" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <!-- Tier 4 to Fusion -->
  <path d="M 743 623 C 786 623, 792 468, 824 468" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>

  <!-- ==================== RIGHT: Synthesized Context & Answer ==================== -->
  <g transform="translate(1095, 342)" filter="url(#shadow)">
    <rect x="0" y="0" width="195" height="132" rx="22" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="97" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">Synthesized Context +</text>
    <text x="97" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">Grounded Response</text>
    <text x="97" y="74" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1D4ED8">(Deterministic Citations [1][2],</text>
    <text x="97" y="90" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1D4ED8">Lean Context Budget)</text>
    <rect x="14" y="102" width="167" height="20" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="0.8"/>
    <text x="97" y="116" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1E40AF">Self-Improving Cache Put</text>
  </g>

  <!-- Arrow: Fusion -> Synthesized Output -->
  <path d="M 1036 408 L 1089 408" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ==================== TOP RECONCILIATION / SLEEP-CYCLE ARROWS ==================== -->
  <!-- Top Daemon to Tier 1, 2, 3, 4 -->
  <path d="M 780 197 C 780 210, 746 240, 746 283" fill="none" stroke="#9333EA" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#arrow-purple)"/>
  <!-- Top Daemon to Fusion & Guardrails -->
  <path d="M 885 197 C 885 250, 915 280, 915 327" fill="none" stroke="#9333EA" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#arrow-purple)"/>

  <!-- Fast-Path Cache Hit Direct Bypass Arrow (Tier 1 -> Synthesized Output) -->
  <path d="M 738 287 C 785 264, 1045 260, 1130 337" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-dasharray="5,5" marker-end="url(#arrow-green)"/>
  <rect x="880" y="254" width="158" height="20" rx="6" fill="#ffffff" stroke="#86EFAC" stroke-width="1"/>
  <text x="959" y="268" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803D">⚡ sub-50ms cache_hit bypass</text>

  <!-- Cache Put Writeback Arrow (Synthesized Output -> Tier 1) -->
  <path d="M 1192 474 C 1192 682, 775 665, 748 350" fill="none" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="4,4" opacity="0.65" marker-end="url(#arrow-blue)"/>
  <rect x="905" y="660" width="168" height="20" rx="4" fill="#ffffff" stroke="#BFDBFE" stroke-width="0.8"/>
  <text x="989" y="674" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#1E40AF">cache_put(query, answer, [1])</text>

</svg>